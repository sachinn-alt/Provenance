<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="bladeGrad" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#ff2200"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ff4400" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Rounded Container -->
  <rect x="2" y="2" width="76" height="76" rx="18" fill="#08080a" stroke="#27272a" stroke-width="2.5"/>

  <!-- The Iconic Triple-Arc Mark ')))' -->
  <g fill="url(#bladeGrad)" filter="url(#subtleGlow)">
    <!-- Arc Blade 1 -->
    <path d="M10 10 C23 28 23 52 10 70 C16 70 28 52 28 40 C28 28 16 10 10 10 Z"/>
    
    <!-- Arc Blade 2 -->
    <path d="M32 10 C45 28 45 52 32 70 C38 70 50 52 50 40 C50 28 38 10 32 10 Z"/>
    
    <!-- Arc Blade 3 -->
    <path d="M54 10 C67 28 67 52 54 70 C60 70 72 52 72 40 C72 28 60 10 54 10 Z"/>
  </g>
</svg>
