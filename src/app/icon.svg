<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="6" y1="6" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#ff2200"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#ff4400" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Outer Dark Squircle Container -->
  <rect x="1" y="1" width="30" height="30" rx="7.5" fill="url(#bgGrad)" stroke="#27272a" stroke-width="1.2"/>
  
  <!-- CPU Core Outer Outline -->
  <rect x="7" y="7" width="18" height="18" rx="3.5" fill="#0f0f13" stroke="url(#orangeGrad)" stroke-width="1.8" filter="url(#glow)"/>
  
  <!-- Circuit Pin Connectors -->
  <path d="M12 3.5v3.5 M16 3.5v3.5 M20 3.5v3.5" stroke="#ff4400" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M12 25v3.5 M16 25v3.5 M20 25v3.5" stroke="#ff4400" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M3.5 12h3.5 M3.5 16h3.5 M3.5 20h3.5" stroke="#ff4400" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M25 12h3.5 M25 16h3.5 M25 20h3.5" stroke="#ff4400" stroke-width="1.6" stroke-linecap="round"/>
  
  <!-- Center Glowing Intelligence Die -->
  <rect x="11.5" y="11.5" width="9" height="9" rx="2" fill="url(#orangeGrad)"/>
  <circle cx="16" cy="16" r="2.2" fill="#ffffff"/>
</svg>
